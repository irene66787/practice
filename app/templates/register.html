{% extends 'base.html' %}
{% load static %}
{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="form_center">
    <form method="post" class="auth-form">
        {% csrf_token %}
        <h2>Регистрация</h2>

        <div class="auth_inputs">
            {{ form.as_p }}
        </div>

        <a href="{% url 'login' %}">Есть аккаунт?</a>
        
        <button>Зарегистрироваться</button>
    </form>
</div>
{% endblock %}
